services:
  cache:
    build: .
    container_name: simple-cache
    restart: unless-stopped
    # Requests in flight get 100s to finish after SIGTERM (long wheels).
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "443:443"
    volumes:
      - certs:/certs
      - cache:/cache
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "/simple-cache", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  certs:
  cache:
