name: govulncheck

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # new advisories land without code changes

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
